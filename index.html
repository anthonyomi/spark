<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140c18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spark">
  <title>Spark</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="brand">
      <img src="icon.svg" alt="" width="64" height="64">
      <h1>Spark</h1>
      <p class="muted">Keep the flame going — together.</p>
    </div>
    <form id="login-form" class="card">
      <label>Email<input type="email" id="l-email" autocomplete="username" required></label>
      <label>Password<input type="password" id="l-pass" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="l-error" class="error"></p>
    </form>
  </section>

  <main id="home" hidden>
    <header class="top">
      <h1><img src="icon.svg" alt="" width="26" height="26"> Spark</h1>
      <button id="signout" class="ghost small">Sign out</button>
    </header>

    <div id="demo-banner" class="banner" hidden>
      Demo mode — entries are saved on this device only. Add your Supabase keys to <code>config.js</code> to sync between phones.
    </div>

    <section class="card hero">
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200" class="ring" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="88"/>
          <circle id="ring-fill" class="fill" cx="100" cy="100" r="88"/>
        </svg>
        <div class="ring-label">
          <div id="time-left" class="big">—</div>
          <div id="time-sub" class="muted"></div>
        </div>
      </div>
      <div id="turn" class="turn"></div>
      <div id="last" class="muted small center"></div>
      <button id="log-btn" class="primary wide">Log a moment</button>
    </section>

    <section id="stats" class="stats"></section>
    <section id="split" class="card split"></section>

    <section class="card">
      <div class="cal-head">
        <button id="prev" class="icon" aria-label="Previous month">‹</button>
        <h2 id="month-label"></h2>
        <button id="next" class="icon" aria-label="Next month">›</button>
      </div>
      <div class="cal cal-dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div id="cal" class="cal"></div>
      <div id="legend" class="legend"></div>
      <div id="day-detail" class="day-detail"></div>
    </section>
  </main>

  <dialog id="log-dialog">
    <form id="log-form">
      <h2>Log a moment</h2>
      <label>When<input type="datetime-local" id="f-when" required></label>
      <fieldset>
        <legend>Who initiated?</legend>
        <div id="f-who" class="seg"></div>
      </fieldset>
      <label>Note <span class="muted">(optional, private to you two)</span>
        <textarea id="f-note" rows="2" maxlength="280"></textarea>
      </label>
      <p id="f-error" class="error"></p>
      <div class="row">
        <button type="button" id="f-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
